<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作、反馈与撤销</title><style>*{box-sizing:border-box}body{margin:0;background:#101812;color:#edf1e7;font:15px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:36px}header small,.eyebrow{color:#d8e866;letter-spacing:.18em;font-size:10px}h1{font-size:clamp(26px,5vw,44px);line-height:1.15;margin:15px 0}header p{color:#aebda9;max-width:65ch}.stage{margin:26px 0;background:#1c2a20;border:1px solid #3a4d3d;border-radius:18px;min-height:230px;padding:28px;overflow:hidden;position:relative}button,select{font:inherit;border:1px solid #52674b;border-radius:8px;background:#223226;color:#edf1e7;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a5ccfa;outline-offset:3px}button.active,button[aria-pressed=true],.primary{background:#d8e866;color:#142015}button:disabled{opacity:.35;cursor:default}nav,.row{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}p{margin:10px 0}.note{font-size:12px;color:#b7c6b0}.report{border-left:3px solid #d8e866;padding:14px 20px;background:#253326;margin-top:22px}.report[hidden]{display:none}.chapter{color:#d8e866;font-size:12px}.track{height:4px;background:#3c503b;margin:20px 0}.track i{display:block;height:100%;background:#d8e866;transition:width .7s}.orb{width:120px;height:120px;background:#d8e866;border-radius:30px;display:grid;place-content:center;color:#1b2b16;font-size:32px;font-weight:bold;transition:transform 1s,background 1s}.tiles{display:flex;gap:14px;align-items:center;justify-content:space-around;min-height:180px}.tile{border:1px solid #627657;border-radius:12px;padding:20px;background:#243c2b;transition:transform .8s,opacity .8s,background .8s}.tile b{display:block;font-size:28px;color:#d8e866}.bars{display:flex;gap:25px;align-items:end;height:180px;justify-content:center}.bar{width:70px;background:#d8e866;transition:height .9s;position:relative;border-radius:8px 8px 0 0}.bar span{position:absolute;bottom:5px;color:#152112;width:100%;text-align:center}.focus-map{height:220px;position:relative;background:linear-gradient(40deg,#2c4330,#1a2c24);transform-origin:30% 50%;transition:transform 1s}.focus-map .tile{position:absolute}.focus-map .a{left:10%;top:15%}.focus-map .b{left:45%;top:50%}.focus-map .c{right:5%;top:10%}.zoom-box{overflow:hidden}.scroll-box{height:260px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:12px;background:#17241b}.scroll-box section{min-height:260px;padding:32px;scroll-snap-align:start}.scroll-box h2{font-size:32px;color:#d8e866}.split{position:relative;min-height:210px;background:#405146;border-radius:10px;overflow:hidden;display:grid;place-content:center}.split .after{position:absolute;inset:0;background:#d8e866;color:#172616;display:grid;place-content:center;clip-path:inset(0 50% 0 0);transition:clip-path .2s}.split h2{font-size:28px}.assembly{height:230px;display:flex;align-items:center;justify-content:center;gap:8px}.piece{width:90px;height:90px;border-radius:14px;background:#839f8a;display:grid;place-content:center;color:#142417;transition:transform 1s,background 1s}.piece:nth-child(2){background:#d8e866}.small{font-size:11px;color:#9eaf9a}input[type=range]{width:100%;accent-color:#d8e866}.receipts{min-height:180px;display:grid;place-content:center}.receipt{padding:22px 40px;border:1px solid #75956a;background:#2a3a2b;transition:transform .6s,opacity .6s}.receipt b{display:block;color:#d8e866;font-size:26px}@media(max-width:550px){main{padding:22px}.stage{padding:16px}.tiles{gap:6px}.tile{padding:10px}.tile b{font-size:22px}.piece{width:75px;height:75px}.bars{gap:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><header><small>ATLAS / NARRATIVE STUDY</small><h1>操作、反馈与撤销</h1><p>把一次决定、结果确认和恢复路径交代完整。</p></header><div class="stage"><div class="receipts"><div class="receipt" id="receipt">草稿<b id="receipt-state">待归档</b><span>演示条目 / 001</span></div></div><div class="row"><button id="archive" class="primary">确认归档</button><button id="undo" disabled>撤销归档</button></div></div><div class="track"><i id="progress"></i></div><div class="chapter" id="chapter"></div><h2 id="headline"></h2><p id="explain" aria-live="polite"></p><nav aria-label="故事章节"><button data-step="0" aria-pressed="false">1 操作前</button><button data-step="1" aria-pressed="false">2 明确决定</button><button data-step="2" aria-pressed="false">3 结果反馈</button><button data-step="3" aria-pressed="false">4 恢复与理解</button></nav><div class="row"><button id="back">上一步</button><button id="next" class="primary">下一步 →</button><button id="restart">重新体验</button></div><p id="result" class="report" hidden>归档与撤销只改变此演示，不会操作真实文件。</p><p class="small">原创机制示意 · 示例数据 · 支持回看与减少动态</p></main><script>(()=>{'use strict';const D={"chapters":[["操作前","用户应知道将改变哪个对象。这里仅操作本地演示条目。"],["明确决定","确认归档后，状态与画面一起变化，用户能立即知道是否成功。"],["结果反馈","条目已归档。保留撤销入口，避免让人猜测如何恢复。"],["恢复与理解","撤销让条目回到待归档。一次操作应包含可靠的恢复路径。"]]};const $=s=>document.querySelector(s);let step=0;const headings=D.chapters;function render(){ $('#chapter').textContent=String(step+1).padStart(2,'0')+' / '+headings.length;$('#headline').textContent=headings[step][0];$('#explain').textContent=headings[step][1];$('#progress').style.width=(step/(headings.length-1)*100)+'%';$('#back').disabled=step===0;$('#next').disabled=step===headings.length-1;$('#result').hidden=step!==headings.length-1;document.querySelectorAll('[data-step]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===step)));paint();}$('#back').onclick=()=>{step=Math.max(0,step-1);render();};$('#next').onclick=()=>{step=Math.min(headings.length-1,step+1);render();};$('#restart').onclick=()=>{step=0;reset();render();};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render();});let archived=false;$('#archive').onclick=()=>{archived=true;step=2;render();};$('#undo').onclick=()=>{archived=false;step=3;render();};function paint(){$('#receipt-state').textContent=archived?'已归档':'待归档';$('#receipt').style.transform=archived?'translateX(35px) scale(.9)':'none';$('#archive').disabled=archived;$('#undo').disabled=!archived;$('#explain').textContent=step>=2?(archived?'当前结果：已归档，可用“撤销归档”恢复。':'当前结果：待归档，未发生不可逆更改。'):D.chapters[step][1];}function reset(){archived=false;}render();})();</script></body></html>
