const titles=['还看不见的开始。','生长，先向下发生。','条件，改变过程。','把结果，留给下一次开始。'];const copies=['一粒种子落进土壤，故事从你看不见的地方开始。','镜头停在根系；没有这一步，地面的变化就失去了依据。','拖动雨量，观察叶片和雨线的变化。环境条件会延续到结尾。',''];function render(){updateChapters();const p=reduced?state.chapter/3:state.progress;$('#bar').style.width=state.progress*100+'%';$('#scene-title').textContent=titles[state.chapter];$('#scene-copy').textContent=state.chapter===3?(state.rain<40?'雨量偏少，植株保留叶片、推迟结果。故事没有失败，只是换了一种节奏。':'条件充足，枝叶长成并留下果实。新的种子让这段过程有了下一章。'):copies[state.chapter];$('#roots').style.opacity=clamp(p*5,0,1);$('#plant').style.transform='scale('+clamp((p-.15)*1.5,0,1)*(state.rain<40?.72:1)+')';$('#fruit').style.opacity=state.chapter===3&&state.rain>=40?1:0;$('#rain').style.opacity=state.chapter>=2?state.rain/200:0;$('#rain-value').textContent=state.rain;$('#rainfall').value=state.rain;$('#rain-note').textContent=state.rain<40?'偏少：生长放缓，结尾推迟结果。':'充足：枝叶展开，结尾留下果实。';}$('#rainfall').oninput=e=>{state.rain=Number(e.target.value);render();emit();};
