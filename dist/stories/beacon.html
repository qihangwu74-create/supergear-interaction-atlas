const config=window.ATLAS_STORY_CONFIG,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let state={chapter:0,progress:0,clues:[],route:null,rain:65,perspective:'both',read:[]},lastFocus=null,returnScroll=0;const media=matchMedia('(prefers-reduced-motion: reduce)');let reduced=media.matches;function applyMotion(){document.body.classList.toggle('reduced',reduced);$('#motion').setAttribute('aria-pressed',String(reduced));$('#motion').textContent=reduced?'动态已减少':'减少动态';render();}$('#motion').onclick=()=>{reduced=!reduced;applyMotion();};function emit(){const snapshot=JSON.parse(JSON.stringify(state));window.dispatchEvent(new CustomEvent('atlas:change',{detail:snapshot}));if(parent!==window&&config.parentOrigin)parent.postMessage({type:'atlas:change',payload:snapshot},config.parentOrigin);}function chapter(n,fromScroll=false){n=clamp(Math.round(n),0,3);if(config.id==='beacon'&&n>state.chapter){if(n>=2&&state.clues.length<2)return;if(n===3&&!state.route)return;}state.chapter=n;if(!fromScroll&&config.scroll){const wrap=$('#scroll-wrap'),amount=wrap.offsetHeight-$('.sticky').offsetHeight;window.scrollTo({top:wrap.offsetTop+amount*n/3,behavior:'instant'});state.progress=n/3;}render();emit();}function reset(){if($('#status'))$('#status').textContent='';state={chapter:0,progress:0,clues:[],route:null,rain:65,perspective:'both',read:[]};if(config.scroll)window.scrollTo({top:$('#scroll-wrap').offsetTop,behavior:'instant'});render();emit();}$('#reset').onclick=reset;$$('[data-chapter]').forEach(b=>b.onclick=()=>chapter(Number(b.dataset.chapter)));function updateChapters(){if($('#count'))$('#count').textContent=String(state.chapter+1).padStart(2,'0')+' / 04';$$('[data-chapter]').forEach(b=>{b.setAttribute('aria-pressed',String(Number(b.dataset.chapter)===state.chapter));if(config.id==='beacon')b.disabled=Number(b.dataset.chapter)>state.chapter&&(Number(b.dataset.chapter)>=2&&state.clues.length<2||Number(b.dataset.chapt const titles=['风暴里，有人等一束光。','先看见，再决定。','两条路，没有完美答案。','你留下的，不只是一个选择。'];const copies=['远处的船请求进入港湾。灯塔还能工作，但你还不知道航道的情况。','读完航道记录和电台消息，才足以作出航线选择。','沿岸更短，但浅滩风险高；外海更长，但需要持续引导。','回顾线索与结果，理解自己的判断。'];function render(){updateChapters();$('#scene-kicker').textContent=config.steps[state.chapter];$('#scene-title').textContent=titles[state.chapter];$('#scene-copy').textContent=copies[state.chapter];$('#route-line').setAttribute('opacity',state.route?'.8':'0');$('#route-line').setAttribute('d',state.route==='coast'?'M220 470Q480 340 690 390T900 450':'M220 470Q450 580 700 505T900 450');$('#ship').setAttribute('transform','translate('+(state.chapter===3?850:320)+' '+(state.route==='offshore'?500:440)+')');const bar=$('#actionbar');if(state.chapter===0)bar.innerHTML='<p>你的任务：读懂条件，为船只提供有依据的路线。</p><button class="primary" id="begin">接听电台 →</button>';if(state.chapter===1)bar.innerHTML='<p>需要读完两条证据。按钮会保留已读状态。</p><div class="actions"><button data-clue="chart">'+(state.clues.includes('chart')?'✓ ':'')+'航道记录</button><button data-clue="radio">'+(state.clues.includes('radio')?'✓ ':'')+'电台消息</button><button class="primary" id="decide" '+(state.clues.length<2?'disabled':'')+'>判断航线 →</button></div>';if(state.chapter===2)bar.innerHTML='<p>选择会改变航线和结局，可以返回重新判断。</p><div class="actions"><button data-route="coast">沿岸航线 · 距离短</button><button data-route="offshore">外海航线 · 持续引导</button></div>';if(state.chapter===3)bar.innerHTML='<p><b>'+(state.route==='offshore'?'更远的路，换来更明确的方向。':'更短的路，也可能需要停下来。')+'</b><br>'+(state.route==='offshore'?'船只绕开浅滩，在引导下缓慢入港；代价是更长的等待。':'船只遇到浅滩后停止推进，等待天亮复核。你需要向等待的人解释延迟。')+'</p><button id="review">回到决定，试另一条路 ↺</button>';$('#tokens').innerHTML=state.clues.map(x=>'<span>✓ '+(x==='chart'?'沿岸有浅滩':'灯塔可持续引导')+'</span>').join('');if($('#begin'))$('#begin').onclick=()=>chapter(1);if($('#decide'))$('#decide').onclick=()=>chapter(2);if($('#review'))$('#review').onclick=()=>chapter(2);$$('[data-clue]').forEach(b=>b.onclick=()=>{const key=b.dataset.clue;if(!state.clues.includes(key))state.clues.p
