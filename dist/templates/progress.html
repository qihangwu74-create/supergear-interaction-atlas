<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加载与完成反馈 · Interaction Atlas</title><style>:root{--accent:#d8e866}*{box-sizing:border-box}body{margin:0;background:#151816;color:#f2f1e9;font:15px/1.55 system-ui,sans-serif;min-height:100vh;padding:28px;display:grid;place-items:center}main{width:min(100%,540px)}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:8px 0 20px}h2{font-size:19px}p{color:#aeb8ad}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#262d28;color:inherit;border:1px solid #465147;border-radius:9px;padding:10px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{accent-color:var(--accent)}input:not([type=range]):not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #465147;background:#1c231e;color:inherit;border-radius:8px}input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#202722;padding:22px;border:1px solid #38473b;border-radius:16px}.tag{font-size:10px;letter-spacing:2px;color:var(--accent)}.muted,small{color:#aeb8ad;font-size:12px}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#435046,#18201c);border-radius:16px;margin:16px 0;overflow:hidden}.object{width:100px;height:125px;background:var(--accent);border-radius:24px 24px 36px 36px;box-shadow:inset -16px -10px 25px #0005,10px 15px 30px #0005;transform:rotate(-12deg);transition:.3s}.status{min-height:24px;color:var(--accent)}[hidden]{display:none!important}dialog{color:inherit;background:#202722;border:1px solid #526455;border-radius:18px;padding:24px;width:min(90vw,450px)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:400px){body{padding:18px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><span class="tag">KNOW WHAT IS HAPPENING</span><h1>等待，也有回应。</h1><div class="panel"><p>模拟导出任务</p><progress id="bar" value="0" max="100" aria-label="模拟任务进度"></progress><p id="status" role="status">准备开始</p><div class="row"><button id="start" class="primary">开始模拟</button><button id="cancel" disabled>取消</button></div></div></main><script>
let timer=null,n=0;const start=document.querySelector('#start'),cancel=document.querySelector('#cancel'),status=document.querySelector('#status');function stop(){clearInterval(timer);timer=null;start.disabled=false;cancel.disabled=true;}start.onclick=()=>{n=0;document.querySelector('#bar').value=0;start.disabled=true;cancel.disabled=false;status.textContent='正在准备…';timer=setInterval(()=>{n=Math.min(100,n+10);document.querySelector('#bar').value=n;status.textContent=n===100?'模拟完成，可重新开始。':'模拟处理中 '+n+'%';if(n===100)stop();},250);};cancel.onclick=()=>{stop();status.textContent='已取消，可以重新开始。';};
</script></body></html>
