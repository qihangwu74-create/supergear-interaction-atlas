<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧边方案清单 · Interaction Atlas</title><style>:root{--accent:#d8e866}*{box-sizing:border-box}body{margin:0;background:#151816;color:#f2f1e9;font:15px/1.55 system-ui,sans-serif;min-height:100vh;padding:28px;display:grid;place-items:center}main{width:min(100%,540px)}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:8px 0 20px}h2{font-size:19px}p{color:#aeb8ad}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#262d28;color:inherit;border:1px solid #465147;border-radius:9px;padding:10px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{accent-color:var(--accent)}input:not([type=range]):not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #465147;background:#1c231e;color:inherit;border-radius:8px}input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#202722;padding:22px;border:1px solid #38473b;border-radius:16px}.tag{font-size:10px;letter-spacing:2px;color:var(--accent)}.muted,small{color:#aeb8ad;font-size:12px}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#435046,#18201c);border-radius:16px;margin:16px 0;overflow:hidden}.object{width:100px;height:125px;background:var(--accent);border-radius:24px 24px 36px 36px;box-shadow:inset -16px -10px 25px #0005,10px 15px 30px #0005;transform:rotate(-12deg);transition:.3s}.status{min-height:24px;color:var(--accent)}[hidden]{display:none!important}dialog{color:inherit;background:#202722;border:1px solid #526455;border-radius:18px;padding:24px;width:min(90vw,450px)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:400px){body{padding:18px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}#drawer{margin:0 0 0 auto;max-height:100%;height:100%;border-radius:18px 0 0 18px;width:min(92vw,340px)}#close{float:right}</style></head><body><main><span class="tag">KEEP YOUR PLACE</span><h1>选择，还在眼前。</h1><div class="art"><div class="object"></div></div><div class="row"><button id="add" class="primary">添加示例方案</button><button id="open">查看清单</button></div><p id="status" role="status">尚未添加</p><dialog id="drawer" aria-labelledby="drawer-title"><button id="close" aria-label="关闭清单">✕</button><h2 id="drawer-title">你的方案清单</h2><div id="summary"></div><p class="muted">前端演示，不会产生订单。</p></dialog></main><script>
let count=0;const d=document.querySelector('#drawer');function render(){document.querySelector('#status').textContent=count?'已添加 '+count+' 件':'尚未添加';const box=document.querySelector('#summary');box.replaceChildren();const p=document.createElement('p');p.textContent=count?'FORM 示例方案 × '+count:'清单为空';box.append(p);if(count){const b=document.createElement('button');b.textContent='移除一件';b.onclick=()=>{count--;render();};box.append(b);}}document.querySelector('#add').onclick=()=>{count++;render();};document.querySelector('#open').onclick=()=>{render();d.showModal();};document.querySelector('#close').onclick=()=>d.close();
</script></body></html>
