<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分组内容切换 · Interaction Atlas</title><style>:root{--accent:#d8e866}*{box-sizing:border-box}body{margin:0;background:#151816;color:#f2f1e9;font:15px/1.55 system-ui,sans-serif;min-height:100vh;padding:28px;display:grid;place-items:center}main{width:min(100%,540px)}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:8px 0 20px}h2{font-size:19px}p{color:#aeb8ad}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#262d28;color:inherit;border:1px solid #465147;border-radius:9px;padding:10px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{accent-color:var(--accent)}input:not([type=range]):not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #465147;background:#1c231e;color:inherit;border-radius:8px}input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#202722;padding:22px;border:1px solid #38473b;border-radius:16px}.tag{font-size:10px;letter-spacing:2px;color:var(--accent)}.muted,small{color:#aeb8ad;font-size:12px}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#435046,#18201c);border-radius:16px;margin:16px 0;overflow:hidden}.object{width:100px;height:125px;background:var(--accent);border-radius:24px 24px 36px 36px;box-shadow:inset -16px -10px 25px #0005,10px 15px 30px #0005;transform:rotate(-12deg);transition:.3s}.status{min-height:24px;color:var(--accent)}[hidden]{display:none!important}dialog{color:inherit;background:#202722;border:1px solid #526455;border-radius:18px;padding:24px;width:min(90vw,450px)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:400px){body{padding:18px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}[role=tab][aria-selected=true]{background:var(--accent);color:#111}.panel{margin-top:20px;min-height:160px}</style></head><body><main><span class="tag">ONE SPACE / THREE VIEWS</span><h1>信息有序，视线连续。</h1><div class="row" role="tablist" aria-label="项目内容"><button id="t0" role="tab" aria-selected="true" aria-controls="p0">概览</button><button id="t1" role="tab" aria-selected="false" aria-controls="p1" tabindex="-1">参数</button><button id="t2" role="tab" aria-selected="false" aria-controls="p2" tabindex="-1">故事</button></div><section class="panel" id="p0" role="tabpanel" aria-labelledby="t0"><h2>为日常而设计。</h2><p>在有限空间中保留清楚的内容层级。</p></section><section class="panel" id="p1" role="tabpanel" aria-labelledby="t1" hidden><h2>180 × 120 × 60</h2><p>尺寸、重量和规格在相同位置查看。</p></section><section class="panel" id="p2" role="tabpanel" aria-labelledby="t2" hidden><h2>从一个想法开始。</h2><p>用过程与细节解释设计选择。</p></section></main><script>
const tabs=[...document.querySelectorAll('[role=tab]')];function pick(i){tabs.forEach((b,j)=>{b.setAttribute('aria-selected',String(j===i));b.tabIndex=j===i?0:-1;document.querySelector('#p'+j).hidden=j!==i;});}tabs.forEach((b,i)=>{b.onclick=()=>pick(i);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;pick(n);tabs[n].focus();};});
</script></body></html>
