<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分步引导表单 · Interaction Atlas</title><style>:root{--accent:#d8e866}*{box-sizing:border-box}body{margin:0;background:#151816;color:#f2f1e9;font:15px/1.55 system-ui,sans-serif;min-height:100vh;padding:28px;display:grid;place-items:center}main{width:min(100%,540px)}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:8px 0 20px}h2{font-size:19px}p{color:#aeb8ad}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#262d28;color:inherit;border:1px solid #465147;border-radius:9px;padding:10px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{accent-color:var(--accent)}input:not([type=range]):not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #465147;background:#1c231e;color:inherit;border-radius:8px}input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#202722;padding:22px;border:1px solid #38473b;border-radius:16px}.tag{font-size:10px;letter-spacing:2px;color:var(--accent)}.muted,small{color:#aeb8ad;font-size:12px}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#435046,#18201c);border-radius:16px;margin:16px 0;overflow:hidden}.object{width:100px;height:125px;background:var(--accent);border-radius:24px 24px 36px 36px;box-shadow:inset -16px -10px 25px #0005,10px 15px 30px #0005;transform:rotate(-12deg);transition:.3s}.status{min-height:24px;color:var(--accent)}[hidden]{display:none!important}dialog{color:inherit;background:#202722;border:1px solid #526455;border-radius:18px;padding:24px;width:min(90vw,450px)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:400px){body{padding:18px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}</style></head><body><main><span class="tag">START SOMETHING</span><h1>把大任务，拆小。</h1><progress id="progress" max="3" value="1" aria-label="填写进度"></progress><form id="form"><section id="step0"><label>项目名称<input id="project" required maxlength="60" placeholder="例如：我的作品集"></label></section><section id="step1" hidden><label>项目类型<select id="kind"><option>作品集</option><option>品牌官网</option><option>电商页面</option></select></label></section><section id="step2" hidden><h2>确认你的选择</h2><p id="review"></p></section><div class="row"><button type="button" id="back" disabled>上一步</button><button class="primary" id="next">下一步</button></div></form><p id="done" role="status"></p></main><script>
let step=0;const form=document.querySelector('#form');function render(){for(let i=0;i<3;i++)document.querySelector('#step'+i).hidden=i!==step;document.querySelector('#project').required=step===0;document.querySelector('#back').disabled=step===0;document.querySelector('#next').textContent=step===2?'确认示例':'下一步';document.querySelector('#progress').value=step+1;document.querySelector('#review').textContent=document.querySelector('#project').value+' · '+document.querySelector('#kind').value;}form.onsubmit=e=>{e.preventDefault();if(step<2){step++;render();}else{document.querySelector('#done').textContent='已确认（本地演示，未提交到服务器）';}};document.querySelector('#back').onclick=()=>{step=Math.max(0,step-1);document.querySelector('#done').textContent='';render();};
</script></body></html>
