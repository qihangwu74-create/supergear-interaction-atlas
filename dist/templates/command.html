<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快捷命令面板 · Interaction Atlas</title><style>:root{--accent:#d8e866}*{box-sizing:border-box}body{margin:0;background:#151816;color:#f2f1e9;font:15px/1.55 system-ui,sans-serif;min-height:100vh;padding:28px;display:grid;place-items:center}main{width:min(100%,540px)}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:8px 0 20px}h2{font-size:19px}p{color:#aeb8ad}button,input,select{font:inherit}button,select{cursor:pointer}button{background:#262d28;color:inherit;border:1px solid #465147;border-radius:9px;padding:10px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{accent-color:var(--accent)}input:not([type=range]):not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #465147;background:#1c231e;color:inherit;border-radius:8px}input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:#202722;padding:22px;border:1px solid #38473b;border-radius:16px}.tag{font-size:10px;letter-spacing:2px;color:var(--accent)}.muted,small{color:#aeb8ad;font-size:12px}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#435046,#18201c);border-radius:16px;margin:16px 0;overflow:hidden}.object{width:100px;height:125px;background:var(--accent);border-radius:24px 24px 36px 36px;box-shadow:inset -16px -10px 25px #0005,10px 15px 30px #0005;transform:rotate(-12deg);transition:.3s}.status{min-height:24px;color:var(--accent)}[hidden]{display:none!important}dialog{color:inherit;background:#202722;border:1px solid #526455;border-radius:18px;padding:24px;width:min(90vw,450px)}dialog::backdrop{background:#000a}label{display:block;margin:12px 0}progress{width:100%;accent-color:var(--accent)}@media(max-width:400px){body{padding:18px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}#commands{display:grid;gap:8px;margin:18px 0}#commands button{text-align:left}</style></head><body><main><span class="tag">LESS CLICKING</span><h1>下一步，直接找到。</h1><button class="primary" id="open">打开命令面板 ⌘ K</button><p id="result" role="status">准备好开始。</p><dialog id="palette" aria-labelledby="dialog-title"><h2 id="dialog-title">你想做什么？</h2><input id="query" aria-label="搜索命令" placeholder="输入搜索…"><div id="commands"></div><button id="close">关闭 Esc</button></dialog></main><script>
const d=document.querySelector('#palette'),q=document.querySelector('#query'),list=['新建项目','打开收藏','查看帮助'];function render(){const hit=list.filter(x=>x.includes(q.value));document.querySelector('#commands').replaceChildren(...hit.map(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>{document.querySelector('#result').textContent='已选择：'+x+'（演示）';d.close();};return b;}));if(!hit.length)document.querySelector('#commands').textContent='没有匹配命令';}function open(){q.value='';render();d.showModal();q.focus();}document.querySelector('#open').onclick=open;document.querySelector('#close').onclick=()=>d.close();q.oninput=render;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(!d.open)open();}});
</script></body></html>
